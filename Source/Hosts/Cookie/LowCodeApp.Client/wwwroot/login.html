<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <base href="/" />
  <title>Login</title>

  <link href="css/bootstrap/bootstrap.min.css" rel="stylesheet" />
  <link href="css/app.css" rel="stylesheet" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <style>
    .empty-center {
      padding: 16px;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #Providers a {
      display: block;
      width: 300px;
      margin-bottom: 8px;
    }
    #QrImage {
      width: 200px;
      height: 200px;
    }
  </style>
</head>
<body>
  <div class="empty-center">
    <div>
      <h1>Login</h1>
      <form id="LoginForm" novalidate>
        <div class="mb-2">
          User ID
          <input id="Id" name="Id" type="text" style="width:300px" class="form-control" autocomplete="username" required />
        </div>
        <div class="mb-2">
          Password
          <input id="Password" name="Password" type="password" style="width:300px" class="form-control" autocomplete="current-password" required />
        </div>
        <div class="mb-3">
          <input id="IsPersistent" name="IsPersistent" type="checkbox" />
          <label for="IsPersistent" class="ms-1">Remember me?</label>
        </div>
        <button id="LoginButton" type="submit" class="btn btn-primary">Login</button>
      </form>

      <!-- 二要素認証 (TOTP)。サーバーの TotpLogin が有効なときだけ、パスワード成功後にこちらへ切り替わる -->
      <form id="TotpForm" novalidate style="display:none;">
        <div id="TotpSetup" class="mb-3" style="display:none; max-width:340px;">
          <p class="mb-2">
            Scan the QR code with your authenticator app
            (Google Authenticator, Microsoft Authenticator, etc.),
            then enter the 6-digit code it shows.
          </p>
          <img id="QrImage" alt="QR code for authenticator app" class="border mb-2" />
          <div class="small text-muted">
            Can't scan? Enter this key manually:<br />
            <code id="SecretText"></code>
          </div>
        </div>
        <div id="TotpPrompt" class="mb-2" style="display:none;">
          Enter the 6-digit code shown in your authenticator app.
        </div>
        <div class="mb-3">
          Authentication code
          <input id="TotpCode" name="TotpCode" type="text" style="width:300px" class="form-control"
                 inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" required />
        </div>
        <button id="VerifyButton" type="submit" class="btn btn-primary">Verify</button>
        <button id="BackButton" type="button" class="btn btn-secondary ms-1">Back</button>
      </form>

      <!-- サーバーに設定された外部 IdP ごとのボタン (api/account/login_options から組み立てる) -->
      <div id="Providers" class="mt-3"></div>
      <div id="ErrorMessage" class="text-danger mt-3" style="display:none;">Login failed.</div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const redirect = sanitizeReturnUrl(params.get("returnUrl"));
    //TOTP の 2 段階目に持ち越す 1 段階目の入力
    let pending = null;

    (async () => {
      if (window.__blazorStarted) location.reload();
    })();

    //外部 IdP ログインに失敗したときサーバーが ?error= に付けて戻す理由コードの表示文言
    const errorMessages = {
      remote_failure: "Login was cancelled or failed.",
      invalid_claims: "The account could not be verified.",
      guest_not_allowed: "Guest accounts are not allowed.",
      domain_not_allowed: "This account's domain is not allowed.",
      user_not_registered: "This account is not registered."
    };
    const error = params.get("error");
    if (error) showError(errorMessages[error] ?? "Login failed");

    (async function loadLoginOptions() {
      try {
        const res = await fetch("/api/account/login_options", { credentials: "include", cache: "no-store" });
        if (!res.ok) return;
        const options = await res.json();
        const password = options.password ?? options.Password ?? true;
        const providers = options.providers ?? options.Providers ?? [];

        if (!password) document.getElementById("LoginForm").style.display = "none";

        //パスワードログイン無効で IdP が 1 つなら画面を出さずに即遷移 (エラー表示中は止まるのでループしない)
        if (!password && providers.length === 1 && !error) {
          location.replace(providerUrl(providers[0]));
          return;
        }

        const container = document.getElementById("Providers");
        for (const p of providers) {
          const a = document.createElement("a");
          a.className = "btn btn-outline-primary";
          a.href = providerUrl(p);
          a.textContent = "Login with " + (p.displayName ?? p.DisplayName ?? p.name ?? p.Name);
          container.appendChild(a);
        }
      } catch { }
    })();

    function providerUrl(p) {
      const name = p.name ?? p.Name;
      return `/api/account/login/${encodeURIComponent(name)}?returnUrl=${encodeURIComponent(redirect)}`;
    }

    document.getElementById("LoginForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const id = document.getElementById("Id").value;
      const password = document.getElementById("Password").value;
      const isPersistent = document.getElementById("IsPersistent").checked;

      if (!id || !password) {
        showError(); return;
      }

      const btn = document.getElementById("LoginButton");
      btn.disabled = true;
      hideError();

      try {
        const res = await postLogin({ Id: id, Password: password, IsPersistent: isPersistent });
        if (!res.ok) {
          showError(); return;
        }

        //二要素認証が有効なら status が setup / totp で返り、まだサインインしていない
        const j = await readJson(res);
        const status = j?.status ?? j?.Status ?? "ok";
        if (status === "setup") {
          document.getElementById("QrImage").src = "data:image/png;base64," + (j?.qrPngBase64 ?? j?.QrPngBase64 ?? "");
          document.getElementById("SecretText").textContent = j?.secret ?? j?.Secret ?? "";
          pending = { Id: id, Password: password, IsPersistent: isPersistent };
          showTotp(true);
          return;
        }
        if (status === "totp") {
          pending = { Id: id, Password: password, IsPersistent: isPersistent };
          showTotp(false);
          return;
        }
        if (status !== "ok") {
          showError(); return;
        }
        await enterApp();
      } catch {
        showError();
      } finally {
        btn.disabled = false;
      }
    });

    document.getElementById("TotpForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!pending) { backToLogin(); return; }

      const code = document.getElementById("TotpCode").value.trim();
      if (!code) {
        showError("Enter the authentication code"); return;
      }

      const btn = document.getElementById("VerifyButton");
      btn.disabled = true;
      hideError();

      try {
        const res = await postLogin({ ...pending, TotpCode: code });
        if (!res.ok) {
          showError(); return;
        }
        const j = await readJson(res);
        const status = j?.status ?? j?.Status ?? "ok";
        if (status !== "ok") {
          showError("Invalid authentication code"); return;
        }
        await enterApp();
      } catch {
        showError();
      } finally {
        btn.disabled = false;
      }
    });

    document.getElementById("BackButton").addEventListener("click", backToLogin);

    async function postLogin(body) {
      const token = await getAntiforgeryToken();
      return await fetch("/api/account/login", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-ANTIFORGERY-TOKEN": token },
        body: JSON.stringify(body),
        credentials: "include",
        cache: "no-store"
      });
    }
    async function readJson(res) {
      try { return await res.json(); } catch { return null; }
    }
    //サインイン後: Cookie でユーザーが取れることを確かめてからアプリへ
    async function enterApp() {
      const me = await fetch("/api/account/current_user", { credentials: "include", cache: "no-store" });
      if (me.ok) {
        const j = await me.json();
        const uid = (j?.value ?? j?.Value ?? "").trim();
        if (uid) {
          if (redirect === "/" || redirect === "") location.href = "/";
          else location.href = redirect;
          return;
        }
      }
      showError();
    }
    function showTotp(isSetup) {
      document.getElementById("LoginForm").style.display = "none";
      document.getElementById("Providers").style.display = "none";
      document.getElementById("TotpForm").style.display = "";
      document.getElementById("TotpSetup").style.display = isSetup ? "" : "none";
      document.getElementById("TotpPrompt").style.display = isSetup ? "none" : "";
      document.getElementById("TotpCode").value = "";
      document.getElementById("TotpCode").focus();
    }
    function backToLogin() {
      pending = null;
      hideError();
      document.getElementById("TotpForm").style.display = "none";
      document.getElementById("LoginForm").style.display = "";
      document.getElementById("Providers").style.display = "";
      document.getElementById("Password").value = "";
    }
    async function getAntiforgeryToken() {
      try {
        await fetch("/api/account/antiforgery", { credentials: "include", cache: "no-store" });
      } catch { }
      return getCookie("X-ANTIFORGERY-TOKEN");
    }
    function getCookie(name) {
      return document.cookie
        .split("; ")
        .find(x => x.startsWith(name + "="))
        ?.split("=")[1] ?? "";
    }
    function showError(message) {
      const el = document.getElementById("ErrorMessage");
      el.textContent = message ?? "Login failed";
      el.style.display = "block";
    }
    function hideError() {
      document.getElementById("ErrorMessage").style.display = "none";
    }
    function sanitizeReturnUrl(u) {
      try {
        if (!u) return "/";
        if (!u.startsWith("/")) return "/";
        if (u.startsWith("//")) return "/";
        return u;
      } catch { return "/"; }
    }
  </script>
</body>
</html>
