<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <base href="/" />
  <title>Login</title>

  <link href="css/bootstrap/bootstrap.min.css" rel="stylesheet" />
  <link href="css/app.css" rel="stylesheet" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <style>
    .empty-center {
      padding: 16px;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #Providers a {
      display: block;
      width: 300px;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <div class="empty-center">
    <div>
      <h1>Login</h1>
      <form id="LoginForm" novalidate>
        <div class="mb-2">
          User ID
          <input id="Id" name="Id" type="text" style="width:300px" class="form-control" autocomplete="username" required />
        </div>
        <div class="mb-2">
          Password
          <input id="Password" name="Password" type="password" style="width:300px" class="form-control" autocomplete="current-password" required />
        </div>
        <div class="mb-3">
          <input id="IsPersistent" name="IsPersistent" type="checkbox" />
          <label for="IsPersistent" class="ms-1">Remember me?</label>
        </div>
        <button id="LoginButton" type="submit" class="btn btn-primary">Login</button>
      </form>
      <!-- サーバーに設定された外部 IdP ごとのボタン (api/account/login_options から組み立てる) -->
      <div id="Providers" class="mt-3"></div>
      <div id="ErrorMessage" class="text-danger mt-3" style="display:none;">Login failed.</div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const redirect = sanitizeReturnUrl(params.get("returnUrl"));

    (async () => {
      if (window.__blazorStarted) location.reload();
    })();

    //外部 IdP ログインに失敗したときサーバーが ?error= に付けて戻す理由コードの表示文言
    const errorMessages = {
      remote_failure: "Login was cancelled or failed.",
      invalid_claims: "The account could not be verified.",
      guest_not_allowed: "Guest accounts are not allowed.",
      domain_not_allowed: "This account's domain is not allowed.",
      user_not_registered: "This account is not registered."
    };
    const error = params.get("error");
    if (error) showError(errorMessages[error] ?? "Login failed");

    (async function loadLoginOptions() {
      try {
        const res = await fetch("/api/account/login_options", { credentials: "include", cache: "no-store" });
        if (!res.ok) return;
        const options = await res.json();
        const password = options.password ?? options.Password ?? true;
        const providers = options.providers ?? options.Providers ?? [];

        if (!password) document.getElementById("LoginForm").style.display = "none";

        //パスワードログイン無効で IdP が 1 つなら画面を出さずに即遷移 (エラー表示中は止まるのでループしない)
        if (!password && providers.length === 1 && !error) {
          location.replace(providerUrl(providers[0]));
          return;
        }

        const container = document.getElementById("Providers");
        for (const p of providers) {
          const a = document.createElement("a");
          a.className = "btn btn-outline-primary";
          a.href = providerUrl(p);
          a.textContent = "Login with " + (p.displayName ?? p.DisplayName ?? p.name ?? p.Name);
          container.appendChild(a);
        }
      } catch { }
    })();

    function providerUrl(p) {
      const name = p.name ?? p.Name;
      return `/api/account/login/${encodeURIComponent(name)}?returnUrl=${encodeURIComponent(redirect)}`;
    }

    document.getElementById("LoginForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const id = document.getElementById("Id").value;
      const password = document.getElementById("Password").value;
      const isPersistent = document.getElementById("IsPersistent").checked;

      if (!id || !password) {
        showError(); return;
      }

      const btn = document.getElementById("LoginButton");
      const err = document.getElementById("ErrorMessage");
      btn.disabled = true;
      err.style.display = "none";

      try {
        const token = await getAntiforgeryToken();
        const res = await fetch("/api/account/login", {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-ANTIFORGERY-TOKEN":token },
          body: JSON.stringify({ Id: id, Password: password, IsPersistent: isPersistent }),
          credentials: "include",
          cache: "no-store"
        });

        if (res.ok) {
          const me = await fetch("/api/account/current_user", { credentials: "include", cache: "no-store" });
          if (me.ok) {
            const j = await me.json();
            const uid = (j?.value ?? j?.Value ?? "").trim();
            if (uid) {
              if (redirect === "/" || redirect === "") location.href = "/";
              else location.href = redirect;
              return;
            }
          }
          showError();
        } else {
          showError();
        }
      } catch {
        showError();
      } finally {
        btn.disabled = false;
      }
    });
    async function getAntiforgeryToken() {
      try {
        await fetch("/api/account/antiforgery", { credentials: "include", cache: "no-store" });
      } catch { }
      return getCookie("X-ANTIFORGERY-TOKEN");
    }
    function getCookie(name) {
      return document.cookie
        .split("; ")
        .find(x => x.startsWith(name + "="))
        ?.split("=")[1] ?? "";
    }
    function showError(message) {
      const el = document.getElementById("ErrorMessage");
      el.textContent = message ?? "Login failed";
      el.style.display = "block";
    }
    function sanitizeReturnUrl(u) {
      try {
        if (!u) return "/";
        if (!u.startsWith("/")) return "/";
        if (u.startsWith("//")) return "/";
        return u;
      } catch { return "/"; }
    }
  </script>
</body>
</html>
