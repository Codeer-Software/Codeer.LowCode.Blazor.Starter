<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <base href="/" />
  <title>ログイン</title>

  <link href="css/bootstrap/bootstrap.min.css" rel="stylesheet" />
  <link href="css/app.css" rel="stylesheet" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <style>
    /* 見た目はここで変える。流れ (ID/パスワード → 二要素認証、外部 IdP のボタン) は login.js が担う。
       タイトル・ロゴ・案内文はデザインの AppSettings > LoginPage から入る (要素の id は login.js が参照するので変えない) */
    .empty-center {
      padding: 16px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-box {
      width: 320px;
    }
    .login-box input.form-control {
      width: 100%;
    }
    #Logo {
      max-width: 320px;
      max-height: 96px;
      margin-bottom: 12px;
    }
    #Providers a {
      display: block;
      margin-bottom: 8px;
    }
    #QrImage {
      width: 200px;
      height: 200px;
    }
    /* login_options を読むまでフォームを隠してちらつきを抑える */
    body:not(.ready) .login-box form,
    body:not(.ready) #Providers {
      visibility: hidden;
    }
  </style>
</head>
<body>
  <div class="empty-center">
    <div class="login-box">
      <img id="Logo" alt="" style="display:none;" />
      <h1 id="Title">ログイン</h1>
      <p id="Message" class="text-muted" style="display:none; white-space: pre-line;"></p>

      <!-- ID/パスワード (サーバーの AllowPasswordLogin が false なら出ない) -->
      <form id="LoginForm" novalidate>
        <div class="mb-2">
          ユーザー ID
          <input id="Id" name="Id" type="text" class="form-control" autocomplete="username" required />
        </div>
        <div class="mb-2">
          パスワード
          <input id="Password" name="Password" type="password" class="form-control" autocomplete="current-password" required />
        </div>
        <div class="mb-3">
          <input id="IsPersistent" name="IsPersistent" type="checkbox" />
          <label for="IsPersistent" class="ms-1">ログイン状態を保持する</label>
        </div>
        <button id="LoginButton" type="submit" class="btn btn-primary">ログイン</button>
      </form>

      <!-- 二要素認証 (ユーザーモジュールに TotpSecretField があるときだけ、パスワード成功後にこちらへ切り替わる) -->
      <form id="TotpForm" novalidate style="display:none;">
        <div id="TotpSetup" class="mb-3" style="display:none;">
          <p class="mb-2">認証アプリ (Google Authenticator、Microsoft Authenticator など) で QR コードを読み取り、表示された 6 桁のコードを入力してください。</p>
          <img id="QrImage" alt="認証アプリ登録用の QR コード" class="border mb-2" />
          <div class="small text-muted">
            読み取れない場合はこのキーを手入力してください:<br />
            <code id="SecretText"></code>
          </div>
        </div>
        <div id="TotpPrompt" class="mb-2" style="display:none;">
          認証アプリに表示されている 6 桁のコードを入力してください。
        </div>
        <div class="mb-3">
          認証コード
          <input id="TotpCode" name="TotpCode" type="text" class="form-control"
                 inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" required />
        </div>
        <button id="VerifyButton" type="submit" class="btn btn-primary">確認</button>
        <button id="BackButton" type="button" class="btn btn-secondary ms-1">戻る</button>
      </form>

      <!-- 外部 IdP (サーバーに設定されたものだけ login.js がボタンを並べる) -->
      <div id="Providers" class="mt-3"></div>
      <div id="ErrorMessage" class="text-danger mt-3" style="display:none;"></div>
    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
