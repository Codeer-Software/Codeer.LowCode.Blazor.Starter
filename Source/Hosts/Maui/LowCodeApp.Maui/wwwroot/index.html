<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>LowCodeApp.Maui</title>
  <base href="/" />
  <link href="css/bootstrap/bootstrap.min.css" rel="stylesheet" />
  <link href="css/app.css" rel="stylesheet" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="stylesheet" href="css/bootstrap-icons/bootstrap-icons.min.css">
  <link href="LowCodeApp.Maui.styles.css" rel="stylesheet" />
  <link href="_content/Sotsera.Blazor.Toaster/toastr.min.css" rel="stylesheet" />
  <style>
    .login-center {
      padding: 16px;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>

<body>
  <div id="app" style="--blazor-load-percentage: 12%; --blazor-load-percentage-text: '12%'">
    <svg class="loading-progress">
      <circle r="40%" cx="50%" cy="50%" />
      <circle r="40%" cx="50%" cy="50%" />
    </svg>
    <div class="loading-progress-text"></div>
    <!-- Plain HTML: the .NET runtime is not attached to this WebView yet, so this is the only thing that
         can report progress during the Blazor startup. LowCodePage replaces it once Blazor takes over. -->
    <div class="app-init-note" aria-live="polite">Starting the app</div>
  </div>

  <div id="blazor-error-ui">
    An unhandled error has occurred.
    <a href="" class="reload">Reload</a>
    <a class="dismiss">🗙</a>
  </div>
  <script src="_framework/blazor.webview.js" autostart="false"></script>
</body>

</html>
